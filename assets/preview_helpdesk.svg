    <rect x="0" y="0" width="450" height="240" rx="8" fill="#060912" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#06b6d4">⚡ FAST DIAGNOSTIC TELEMETRY (DESK 3A / PC-DELL-8821)</text>

    <rect x="14" y="38" width="100" height="22" rx="4" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.3)" />
