    <text x="12" y="95" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">✓ Marcus: Dispatched with replacement CalDigit TS4 dock</text>
  </g>

  <!-- Live Ticket 2 -->
  <g transform="translate(695, 260)">
    <rect x="0" y="0" width="450" height="100" rx="8" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.4)" stroke-width="1" />
    <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f87171">IT-1042</text>
    <rect x="70" y="12" width="75" height="18" rx="3" fill="rgba(239,68,68,0.25)" stroke="rgba(239,68,68,0.5)" />
    <text x="78" y="25" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#ff6b6b">EMERGENCY</text>

    <rect x="385" y="12" width="53" height="18" rx="9" fill="rgba(245,158,11,0.2)" />
    <text x="398" y="25" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fbbf24">OPEN</text>

    <text x="12" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">PC frozen on black screen with spinning wheel</text>
    <text x="12" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">👤 Alex Rivera (Eng) • 📍 Floor 2 Desk 2F • 🏷️ MAC-STUDIO-4402</text>
  </g>

  <!-- Technician Fast Diagnostics Box -->
