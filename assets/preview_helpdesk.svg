    <rect x="122" y="38" width="125" height="22" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" />
    <text x="130" y="53" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">Dell ProSupport: OK</text>

    <rect x="255" y="38" width="180" height="22" rx="4" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" />
    <text x="265" y="53" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fbbf24">Dock Firmware: v38 (Outdated)</text>

    <!-- Code output -->
    <rect x="14" y="70" width="422" height="110" rx="6" fill="#03050a" />
    <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">[PORT HANDSHAKE] DP-Alt Mode: Negotiation Timeout</text>
    <text x="24" y="108" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">GPU Driver: Intel Iris Xe (Driver v31.0.101.4578)</text>
    <text x="24" y="126" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">Solution: Flash dock firmware to v42.0 &amp; reboot host.</text>
    <text x="24" y="148" font-family="'JetBrains Mono', monospace" font-size="9" fill="#06b6d4">Dispatched Tech: Marcus Vance onsite with replacement unit.</text>

    <!-- Mark Resolved Button -->
    <rect x="14" y="190" width="422" height="36" rx="6" fill="#10b981" />
    <text x="145" y="213" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff">✅ MARK TICKET RESOLVED &amp; NOTIFY EMPLOYEE</text>
  </g>
