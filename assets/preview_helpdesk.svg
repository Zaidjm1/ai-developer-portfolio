    <rect x="400" y="0" width="180" height="38" rx="6" fill="#090d18" stroke="rgba(255,255,255,0.08)" />
    <text x="410" y="23" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">URGENCY: <tspan fill="#fbbf24">🟠 High (1h SLA)</tspan></text>

