    <text x="308" y="24" font-size="16">💻</text>
    <text x="308" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fca5a5">PC Freeze</text>
    <text x="308" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">BSOD, RAM crash</text>

    <!-- Cat 4: Accounts -->
    <rect x="444" y="0" width="138" height="68" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
    <text x="456" y="24" font-size="16">🔑</text>
    <text x="456" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Accounts</text>
    <text x="456" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">SSO, software</text>
