  <text x="33" y="32" font-family="'JetBrains Mono', monospace" font-size="14" fill="#06b6d4">⚡</text>
  <text x="60" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">PulseDesk <tspan fill="#06b6d4">IT</tspan></text>
  <text x="180" y="33" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">| WORKPLACE HELPDESK</text>

  <!-- Multi-Role Account Switcher Pills -->
  <rect x="420" y="12" width="410" height="30" rx="15" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" />
  <rect x="424" y="15" width="130" height="24" rx="12" fill="rgba(6,182,212,0.25)" stroke="rgba(6,182,212,0.5)" />
  <text x="435" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">👤 Employee (Sarah)</text>
  <text x="568" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">🛠️ IT Tech (Marcus)</text>
  <text x="702" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">🛡️ IT Admin (Elena)</text>

  <!-- Live Queue Status -->
  <rect x="990" y="14" width="180" height="26" rx="13" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" />
  <circle cx="1006" cy="27" r="4" fill="#10b981" />
  <text x="1018" y="31" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">4 TICKETS ACTIVE</text>

