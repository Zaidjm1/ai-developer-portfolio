    <text x="12" y="142" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Tried power cycling dock and re-plugging host cable. Need dual</text>
    <text x="12" y="162" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">displays for client design presentation in 1 hour."</text>

    <!-- AI Self-Help Hint -->
    <rect x="0" y="218" width="580" height="42" rx="6" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.25)" />
    <text x="14" y="243" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">💡 Tip: Press <tspan fill="#06b6d4" font-family="'JetBrains Mono', monospace">Win + Ctrl + Shift + B</tspan> to restart GPU drivers before dispatching IT.</text>

