    <text x="12" y="24" font-size="16">🌐</text>
    <text x="12" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Network &amp; Wi-Fi</text>
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">VPN, DNS, drops</text>

    <!-- Cat 2: Peripherals -->
    <rect x="148" y="0" width="138" height="68" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
    <text x="160" y="24" font-size="16">🖱️</text>
    <text x="160" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Peripherals</text>
    <text x="160" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Monitors, docks</text>

    <!-- Cat 3: Crash -->
